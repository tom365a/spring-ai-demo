spring:
  ai:
    model:
      chat: openai
      embedding: ${EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        api-key: ${OPENAI_API_KEY:sk-not-configured}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.2}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:sk-not-configured}}
        base-url: ${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

app:
  llm:
    provider: openai
  vector:
    backend: ${APP_VECTOR_BACKEND:lexical}
  rag:
    score-threshold: ${RAG_SCORE_THRESHOLD:0.15}
