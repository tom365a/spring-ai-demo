spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cs;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

app:
  mcp:
    enabled: false
  vector:
    backend: simple
  knowledge-sample-dir: ../../samples/knowledge
  agent-config:
    enabled: ${APP_AGENT_CONFIG_ENABLED:true}
    seed-on-startup: true
    fallback-to-legacy: false
    prompt-max-length: 20000
    trial-session-ttl-minutes: 60

logging:
  level:
    com.demo.cs: DEBUG
