<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一资源配置 · R1 产品原型</title>
<style>
:root{color-scheme:dark;--bg:#101b20;--panel:#19292f;--line:#334b53;--ink:#e9f4f3;--muted:#a5bbc0;--green:#79e1c3;--yellow:#ffcb76;--red:#ffabab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:#243d46;color:var(--ink)}button.primary{background:var(--green);border-color:var(--green);color:#092a23;font-weight:650}button.danger{color:var(--red)}button:disabled{opacity:.42;cursor:not-allowed}input:not([type=checkbox]),textarea,select{width:100%;background:#112127;color:var(--ink);border:1px solid #44616c;border-radius:6px;padding:10px;margin-top:6px}input[type=checkbox]{accent-color:var(--green)}textarea{resize:vertical}select[multiple]{min-height:108px}h1{font-size:25px;margin:3px 0}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:18px 0 10px}p{margin:7px 0;color:var(--muted)}small,.muted{color:var(--muted)}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:650}.badge{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:16px;font-size:12px;color:var(--green)}.warn{color:var(--yellow)}.layout{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 82px)}nav{padding:24px 15px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:9px;border-color:transparent;background:transparent;padding:12px 15px}nav button.active{background:#27463f;color:var(--green)}main{padding:28px;max-width:1450px;width:100%;margin:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:20px}.toolbar{margin:22px 0 18px}.toolbar input{max-width:320px;margin:0}.toolbar select{max-width:165px;margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.card{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.card p{min-height:44px}.card .row{margin-top:13px}.card strong{font-size:16px}.field{display:block;margin-bottom:15px}.field>small{display:block;margin-top:4px}.check{display:flex;align-items:center;gap:8px;padding:8px 0}.notice{padding:13px;border:1px solid #436451;border-radius:8px;background:#20372f;margin:14px 0;color:#c5e9dc}.notice.warn{border-color:#755e3b;background:#302b23;color:var(--yellow)}.hint{padding:12px;background:#20343d;border-radius:7px}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);margin-top:18px}.modal{position:fixed;inset:0;background:#020b10bb;display:flex;justify-content:center;align-items:center;padding:22px;z-index:10}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:25px}.dialog.small{max-width:690px}.close{float:right}.hidden{display:none!important}#toast{position:fixed;bottom:18px;right:20px;background:#284b3f;border:1px solid var(--green);padding:13px 20px;border-radius:8px;z-index:30;max-width:min(480px,90vw)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#112026;border:1px solid var(--line);padding:13px;border-radius:7px;font-size:12px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:9px}details{margin:12px 0}summary{cursor:pointer;color:var(--green)}.tabs{margin:16px 0;display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:22px;color:var(--green)}@media(max-width:760px){header{padding:14px;display:block}.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);padding:9px;display:flex;gap:5px;overflow:auto}nav button{white-space:nowrap;width:auto;margin:0}main{padding:16px}.grid{grid-template-columns:1fr}.modal{padding:8px}.dialog{padding:17px;max-height:95vh}.foot button{flex:1}.cards{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">Agent 工作台 <span class="badge">资源配置 R1</span></div><div><span class="badge warn">交互原型 · 内存演示数据</span> <small>不连接8080、不保存凭证、不发送任何网络请求</small></div></header>
<div class="layout"><nav id="nav" aria-label="一级导航"></nav><main><div class="row between"><div><small id="eyebrow">资源管理</small><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="create">新增资源</button></div><div class="row toolbar"><input id="search" aria-label="搜索资源" placeholder="搜索名称、简介或标识"><select id="status" aria-label="筛选状态"><option value="all">全部状态</option><option value="active">已启用</option><option value="draft">未启用草稿</option><option value="inactive">已停用</option><option value="dirty">有未发布变更</option></select><button id="reset">重置原型数据</button></div><div id="summary"></div><div id="content" class="cards"></div><p id="bottomHint"></p></main></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="资源详情"><div id="dialog" class="dialog"></div></div><div id="toast" role="status" aria-live="polite" class="hidden"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={agents:'Agents',models:'模型',tools:'工具',mcp:'MCP',skills:'技能'}, tips={agents:'关联资源与授权，配置实际模型、能力、记忆和执行上限。',models:'同一进程可使用多个供应商；每个 Agent 独立选择模型。',tools:'统一管理内置、HTTP 和 MCP 工具；写操作必须在执行前确认。',mcp:'标准 Streamable HTTP 与项目兼容桥分开配置、同步与验收。',skills:'可复用指令和能力组合；新版本须由引用 Agent 显式升级。'};
let page='agents', editing=null, timer, events=[], serial=1;
const seed={models:[{id:'kimi_service',name:'日常 Kimi',description:'默认对话与工具推理',provider:'Kimi',model:'kimi-k3',url:'https://api.moonshot.cn',timeout:90,reasoning:'low',tokens:4096,credential:'服务端变量 KIMI_API_KEY',active:true,version:1,dirty:false,isDefault:true},{id:'openai_service',name:'OpenAI 备用',description:'未充值，本原型仅模拟连接',provider:'OpenAI',model:'gpt-4o-mini',url:'https://api.openai.com',timeout:90,credential:'服务端变量 OPENAI_API_KEY',active:false,version:0,dirty:false}],tools:[{id:'query_order',name:'查询订单',description:'内置模拟业务：查询当前用户订单',kind:'内置',risk:'READ',active:true,version:1,dirty:false},{id:'http_return',name:'登记售后申请',description:'自定义 HTTP 写入工具；显式授权本地目标',kind:'HTTP',risk:'WRITE',method:'POST',url:'http://127.0.0.1:19090/returns',auth:'Bearer',credential:'已加密配置（演示）',timeout:30,schema:'{"type":"object","properties":{"orderId":{"type":"string"}},"required":["orderId"],"additionalProperties":false}',mapping:'输入 orderId → JSON Body orderId\n固定 页面申请 → JSON Body source',extract:'data.requestId',active:true,version:1,dirty:false},{id:'mcp_service_a__search',name:'search · 售后资料',description:'MCP 来源：服务A / search，身份不会与服务B串用',kind:'MCP',service:'service_a',risk:'WRITE',active:true,version:1,dirty:false}],mcp:[{id:'service_a',name:'售后资料服务A',description:'标准协议；未核实风险的工具默认写入',transport:'标准 MCP · Streamable HTTP',url:'http://127.0.0.1:19091/mcp',auth:'无认证',credential:'未配置',timeout:30,active:true,version:1,dirty:false,tools:['search'],sync:'上次同步成功（演示）'},{id:'legacy_bridge',name:'原项目知识桥',description:'保留的项目 HTTP 桥，不代表标准 MCP',transport:'项目 HTTP 桥 · 兼容',url:'http://127.0.0.1:19092',auth:'无认证',credential:'未配置',timeout:30,active:true,version:1,dirty:false,tools:['knowledge_search'],sync:'上次同步成功（演示）'}],skills:[{id:'after_sale_skill',name:'售后处理指引',description:'先查询订单，再登记申请；写入前需要确认',instructions:'先依据查询结果说明订单情况。需要登记售后时，向用户展示操作参数并等待确认。',types:['WORKER'],tools:['query_order','http_return'],rag:false,active:true,version:1,dirty:false},{id:'clear_response',name:'清晰表达',description:'先结论、后步骤，不附加工具权限',instructions:'先给出明确结论，再提供简洁步骤，不编造信息。',types:['SUPERVISOR','WORKER'],tools:[],rag:false,active:true,version:1,dirty:false}],agents:[{id:'support_worker',name:'售后处理助手',description:'处理订单查询与售后申请',type:'WORKER',prompt:'你是售后处理助手，依据实际工具结果回答。',model:'kimi_service',tools:['query_order','http_return'],skills:['after_sale_skill'],skillPins:{after_sale_skill:1},mcpTools:[],children:[],write:true,rounds:3,timeout:30,totalTimeout:120,history:10,summary:true,rag:false,active:true,version:1,dirty:false},{id:'support_main',name:'客服主 Agent',description:'识别用户问题，单次转交给合适助手',type:'SUPERVISOR',prompt:'根据职责将请求转交给售后处理助手。',model:'default',tools:['query_order'],skills:['clear_response'],skillPins:{clear_response:1},mcpTools:[],children:['support_worker'],write:false,rounds:3,timeout:30,totalTimeout:120,history:5,summary:true,rag:false,active:true,version:1,dirty:false}]};
let db=structuredClone(seed);const list=()=>db[page];const find=(kind,id)=>db[kind].find(x=>x.id===id);const refs=(kind,id)=>{const found=[];for(const a of db.agents){if(kind==='models'&&(a.model===id||(find('models',id)?.isDefault&&a.model==='default')))found.push(a.name);if(kind==='tools'&&a.tools?.includes(id))found.push(a.name);if(kind==='skills'&&a.skills?.includes(id))found.push(a.name);if(kind==='agents'&&a.children?.includes(id))found.push(a.name);if(kind==='mcp'&&a.mcpTools?.some(t=>t.startsWith(id+'::')))found.push(a.name);}if(kind==='tools')for(const s of db.skills)if(s.tools?.includes(id))found.push('技能：'+s.name);if(kind==='mcp')found.push(...db.tools.filter(t=>t.service===id).map(t=>'工具：'+t.name));return [...new Set(found)];};
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}function close(){$('#modal').classList.add('hidden');$('#dialog').innerHTML='';editing=null}function modal(html,small=false){$('#dialog').className='dialog'+(small?' small':'');$('#dialog').innerHTML='<button class="close" type="button" data-act="close" aria-label="关闭">×</button>'+html;$('#modal').classList.remove('hidden')}
function nav(){ $('#nav').innerHTML=Object.entries(labels).map(([k,n])=>'<button data-page="'+k+'" class="'+(k===page?'active':'')+'">'+n+'</button>').join('');}
function render(){nav();$('#title').textContent=labels[page];$('#subtitle').textContent=tips[page];$('#create').textContent=page==='agents'?'+ 创建 Agent':page==='tools'?'+ 创建 HTTP 工具':'+ 新建'+labels[page];let rows=list().filter(x=>(x.name+' '+x.description+' '+x.id).toLowerCase().includes($('#search').value.toLowerCase()));const state=$('#status').value;if(state!=='all')rows=rows.filter(x=>state==='active'?x.active:state==='dirty'?x.dirty:state==='draft'?!x.version:!x.active&&x.version);
$('#summary').innerHTML=page==='agents'?'<div class="notice">资源定义在对应页面维护；此处选择已发布版本并授权。主 Agent 最多转交1次，子 Agent 不再转交。</div>':page==='models'?'<div class="notice">当前默认：'+esc(db.models.find(x=>x.isDefault)?.name||'未设置')+'。保存不发送模型请求；连接测试始终单独发起。</div>':page==='mcp'?'<div class="notice">同步产生待发布目录。新工具不会自动获得 Agent 授权；同步失败保留当前发布目录。</div>':page==='skills'?'<div class="notice">发布新技能版本不会改变已有 Agent；接受升级 → Agent 草稿 → 重新发布后生效。</div>':'<div class="notice">三类工具共用授权、写确认、轮数、超时和审计。默认不自动重试外部请求。</div>';
$('#content').innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="row between"><strong>'+esc(x.name)+'</strong><span class="badge '+(!x.active?'warn':'')+'">'+(x.active?'已启用 v'+x.version:x.version?'已停用':'未启用草稿')+'</span></div><p>'+esc(x.description)+'</p><small>'+esc(x.id)+' · '+esc(page==='models'?x.provider+' / '+x.model:page==='tools'?x.kind+' / '+(x.risk==='WRITE'?'写入·需确认':'只读'):page==='mcp'?x.transport:page==='agents'?x.type:'固定版本绑定')+'</small>'+(x.dirty?'<div class="warn">● 有未发布变更</div>':'')+(x.isDefault?'<div class="badge">系统默认</div>':'')+'<div class="row"><button data-act="edit" data-id="'+esc(x.id)+'">配置详情</button><button data-act="publish" data-id="'+esc(x.id)+'">'+(x.active?'发布更新':'启用')+'</button><button data-act="refs" data-id="'+esc(x.id)+'">引用 '+refs(page,x.id).length+'</button>'+(x.active?'<button data-act="disable" data-id="'+esc(x.id)+'">停用</button>':'')+'</div></article>').join(''):'<div class="panel"><h2>暂无匹配资源</h2><p>调整搜索/状态筛选，或创建第一项资源。</p></div>';$('#bottomHint').textContent='原型演示：刷新或重置会恢复初始数据，所有连接、同步和调用结果均为模拟。';}
const input=(name,value,type='text',extra='')=>'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>';
const field=(label,control,hint='')=>'<label class="field">'+label+control+(hint?'<small>'+hint+'</small>':'')+'</label>';
const area=(name,value,rows=3)=>'<textarea name="'+name+'" rows="'+rows+'">'+esc(value)+'</textarea>';
const select=(name,options,value,multiple=false)=>'<select name="'+name+'" '+(multiple?'multiple':'')+'>'+options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(v)+'" '+((multiple?(value||[]).includes(v):v===value)?'selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>';
const check=(name,label,on,disabled=false)=>'<label class="check"><input name="'+name+'" type="checkbox" '+(on?'checked':'')+' '+(disabled?'disabled':'')+'>'+label+'</label>';
function cred(x){return '<div class="section"><h3>凭证</h3><div class="hint">当前：'+esc(x.credential||'未配置')+'；服务端从不返回原文。</div>'+field('凭证操作',select('credentialAction',['保留当前','替换为新值','引用服务端变量','清除'],'保留当前'),'留空保留；选择替换时必须填写新值；清除先进入草稿。')+'<div id="newSecret" class="hidden">'+field('新凭证',input('secret','','password','autocomplete="new-password"'),'原型不保存此输入，也不会发送到任何服务。')+'</div><div id="envSecret" class="hidden">'+field('服务端变量名',input('environment',''),'只引用服务器允许的变量，不返回变量值。')+'</div><div id="clearSecret" class="notice warn hidden">清除会使需要认证的资源无法连接。保存草稿尚不影响已发布版本，发布时将再次展示影响。</div></div>';}
function defaults(){const common={id:'',name:'',description:'',version:0,active:false,dirty:false};return Object.assign(common,page==='models'?{provider:'Kimi',model:'kimi-k3',url:'https://api.moonshot.cn',timeout:90,tokens:4096,credential:'未配置'}:page==='tools'?{kind:'HTTP',risk:'WRITE',method:'POST',url:'http://127.0.0.1:19090/demo',auth:'无认证',timeout:30,schema:'{"type":"object","properties":{"orderId":{"type":"string"}},"required":["orderId"],"additionalProperties":false}',mapping:'输入 orderId → JSON Body orderId',extract:'data',credential:'未配置'}:page==='mcp'?{transport:'标准 MCP · Streamable HTTP',url:'http://127.0.0.1:19091/mcp',timeout:30,auth:'无认证',tools:[],credential:'未配置'}:page==='skills'?{types:['WORKER'],tools:[],instructions:'',rag:false}:{type:'WORKER',prompt:'',model:'default',tools:[],skills:[],skillPins:{},mcpTools:[],children:[],rounds:3,timeout:30,totalTimeout:120,history:10,summary:true,write:false,rag:false});}
function edit(id){const x=id?structuredClone(find(page,id)):defaults();editing={kind:page,id:id||null};const tools=db.tools.filter(t=>t.active).map(t=>[t.id,t.name+' · '+t.kind+' · '+(t.risk==='WRITE'?'写入/需确认':'只读')]);let body='<form id="editor"><h2>'+(id?'编辑':'新建')+labels[page]+'</h2><div class="badge">'+(x.version?'线上 v'+x.version:'未发布')+' · 保存仅更新草稿</div><div class="grid">'+field('名称 *',input('name',x.name,'text','required'))+field('稳定标识',input('id',x.id,'text',id?'readonly':''),'留空自动生成；重命名不改变引用。')+'</div>'+field('简介',area('description',x.description));
if(page==='models')body+='<div class="grid">'+field('供应商',select('provider',['Kimi','OpenAI'],x.provider))+field('模型标识',input('model',x.model))+field('接口地址',input('url',x.url))+field('请求超时（秒）',input('timeout',x.timeout,'number','min="1" max="600"'))+'</div><div id="kimiOptions" '+(x.provider==='OpenAI'?'class="hidden"':'')+'>'+field('推理强度',select('reasoning',['low','medium','high'],x.reasoning||'low'))+'<p>K3 不提供关闭思考或无效温度参数。</p></div><div id="openaiOptions" '+(x.provider!=='OpenAI'?'class="hidden"':'')+'>'+field('默认温度',input('temperature',x.temperature??0.2,'number','min="0" max="2" step="0.1"'))+'</div>'+field('最大完成 Token',input('tokens',x.tokens||4096,'number','min="1"'))+check('toolSupport','支持工具调用',true)+cred(x)+'<div class="section"><button type="button" data-act="connection">测试连接（模拟）</button><p>真实产品此操作可能产生少量模型用量；保存不会自动测试。本原型仅展示结果。</p><div id="connectionResult" class="hint">未测试</div></div>';
if(page==='tools'){body+='<span class="badge">来源：'+esc(x.kind)+'</span>';if(x.kind==='HTTP')body+='<div class="grid">'+field('请求方法',select('method',['GET','POST','PUT','PATCH','DELETE'],x.method))+field('固定 URL',input('url',x.url))+field('认证方式',select('auth',['无认证','Bearer','API Key Header'],x.auth))+field('API Key Header 名',input('authHeader',x.authHeader||'X-Api-Key'))+'</div>'+field('输入 JSON Schema',area('schema',x.schema,5))+field('声明式参数映射',area('mapping',x.mapping,4),'路径/查询/Header/JSON Body；输入不得覆盖认证或连接目标。')+field('响应提取字段路径',input('extract',x.extract),'$为整体，支持data.items[0].name；缺字段报错，null是有效值。')+cred(x)+'<div class="section">'+field('明确授权连接目标',input('target',new URL(x.url||'http://127.0.0.1:19090').origin),'仅该scheme/host/port；本地目标需显式许可。')+check('allowLocal','允许以上精确的本地/内网目标（演示）',true)+'</div>';else body+='<div class="notice">'+(x.kind==='内置'?'实现与基础风险由代码提供，仅允许维护展示和更严格规则。':'定义由 MCP 服务同步维护。请从 MCP 页面查看并发布目录，不在此修改协议。')+'</div>';
body+='<div class="grid">'+field('操作属性',select('risk',['READ','WRITE'],x.risk))+field('单次资源超时（秒）',input('timeout',x.timeout||30,'number','min="1" max="300"'))+'</div>'+check('confirm','写工具强制确认；只读也可增加确认',x.risk==='WRITE',x.risk==='WRITE')+'<p>响应上限1MiB，工具结果上限32KiB；外部写请求不自动重试。</p><div class="section">'+field('测试参数 JSON',area('testArgs','{"orderId":"DEMO-001"}'))+'<button type="button" data-act="tooltest">预览并测试（模拟）</button><p>写工具测试仍需确认。真实产品与Agent共用统一执行器。</p></div>';}
if(page==='mcp')body+='<div class="grid">'+field('传输类型',select('transport',['标准 MCP · Streamable HTTP','项目 HTTP 桥 · 兼容'],x.transport))+field('服务地址',input('url',x.url))+field('认证方式',select('auth',['无认证','Bearer','API Key Header'],x.auth))+field('超时（秒）',input('timeout',x.timeout,'number','min="1" max="300"'))+'</div>'+field('目标授权（精确主机/端口）',input('target',new URL(x.url).origin))+check('allowLocal','明确允许以上本地测试目标',true)+cred(x)+'<div class="section"><div class="row"><button type="button" data-act="connection">测试连接（模拟）</button><button type="button" data-act="sync" data-id="'+esc(x.id)+'">同步工具（模拟）</button><button type="button" data-act="syncfail">模拟同步失败</button></div><div id="connectionResult" class="hint">'+esc(x.sync||'未测试/未同步')+'</div><h3>当前已发布工具</h3><p>'+esc((x.tools||[]).join('、')||'暂无工具，先同步并发布目录。')+'</p><p>新增工具默认写入/需确认；不会自动授予已关联服务的Agent。</p></div>';
if(page==='skills')body+=field('技能指令 *',area('instructions',x.instructions,5))+field('适用 Agent 类型',select('types',[['SUPERVISOR','主 Agent'],['WORKER','子 Agent']],x.types,true),'包含写工具的技能只能适用于子Agent。')+field('依赖工具',select('tools',tools,x.tools,true))+check('rag','需要知识检索（当前为本地关键词）',x.rag)+field('使用说明',area('usage',x.usage||''))+'<div class="notice">发布只产生新版本，现有Agent保持原绑定。接受升级后还需重新发布Agent。</div>';
if(page==='agents')body+=field('类型',select('type',[['WORKER','子 Agent'],['SUPERVISOR','主 Agent']],x.type))+field('系统提示词 *',area('prompt',x.prompt,5))+'<div class="section"><h3>模型与能力</h3>'+field('使用模型',select('model',[['default','使用系统默认'],...db.models.filter(m=>m.active).map(m=>[m.id,m.name+' / '+m.provider+' / '+m.model])],x.model))+check('inherit','继承所选模型默认参数',true,true)+field('直接授权工具',select('tools',tools,x.tools,true))+field('绑定技能',select('skills',db.skills.filter(s=>s.active).map(s=>[s.id,s.name+' · 最新v'+s.version+' · 已绑定v'+(x.skillPins?.[s.id]||s.version)]),x.skills,true))+'<button type="button" data-act="upgrade" data-id="'+esc(x.id)+'">查看技能版本差异 / 接受更新</button>'+field('MCP服务内精确工具授权',select('mcpTools',db.mcp.filter(s=>s.active).flatMap(s=>s.tools.map(t=>[s.id+'::'+t,s.name+' / '+t])),x.mcpTools,true),'空选择不授权；新同步工具不会自动勾选。')+check('rag','启用知识检索',x.rag)+'</div><div id="childSection" class="section '+(x.type!=='SUPERVISOR'?'hidden':'')+'"><h3>子 Agent</h3>'+field('关联已启用子Agent',select('children',db.agents.filter(a=>a.active&&a.type==='WORKER').map(a=>[a.id,a.name]),x.children,true))+'<div class="hint">本轮最多转交1次（固定）。子Agent不能再次转交。</div></div><div class="section"><h3>运行规则</h3>'+check('write','允许修改业务数据（主Agent固定禁止）',x.write,x.type==='SUPERVISOR')+'<div class="hint">写工具始终需要用户确认，不能通过技能或MCP绕过。</div><div class="grid">'+field('最多工具调用轮数',input('rounds',x.rounds,'number','min="0" max="20"'),'一条模型响应的一批工具请求算1轮；每批最多10项。')+field('单工具超时（秒）',input('timeout',x.timeout,'number','min="1" max="300"'))+field('单任务总超时（秒）',input('totalTimeout',x.totalTimeout,'number','min="1" max="600"'))+field('保留历史对话轮数',input('history',x.history,'number','min="0" max="50"'))+'</div>'+check('summary','注入本会话公开摘要',x.summary)+'<p>跨Agent共享同会话公开对话，各自裁剪最近N轮；隐藏工具/思考不共享。当前输入只注入一次。</p></div>';
body+='<div id="formError" class="notice warn hidden"></div><div class="foot"><button type="button" data-act="close">取消</button><button class="primary" type="submit">保存草稿</button></div></form>';modal(body);}
function values(){const f=$('#editor'),d=new FormData(f),out={};for(const [k,v]of d)out[k]=v;for(const k of ['tools','skills','mcpTools','children','types'])if(f.elements[k])out[k]=d.getAll(k);for(const k of ['write','summary','rag','allowLocal'])if(f.elements[k])out[k]=f.elements[k].checked;for(const k of ['timeout','totalTimeout','rounds','history','tokens','temperature'])if(out[k]!==undefined)out[k]=Number(out[k]);return out;}
function save(){const v=values(),meta=editing,x=meta.id?find(meta.kind,meta.id):defaults();if(!v.name?.trim())return error('请填写资源名称，输入会保留。');if(meta.kind==='agents'&&!v.prompt?.trim()||meta.kind==='skills'&&!v.instructions?.trim())return error('请填写提示词或技能指令。');if(v.credentialAction==='替换为新值'&&!v.secret)return error('替换凭证必须填写新值；留空请选择保留当前。');if(v.credentialAction==='引用服务端变量'&&!v.environment?.trim())return error('请填写服务端允许的变量名。');if(v.schema){try{JSON.parse(v.schema)}catch{return error('输入Schema不是有效JSON。')}}if(v.type==='SUPERVISOR'){v.write=false;v.children=v.children||[]}else if(meta.kind==='agents')v.children=[];if(v.credentialAction==='替换为新值')v.credential='已加密配置（演示）';if(v.credentialAction==='引用服务端变量')v.credential='服务端变量 '+v.environment.trim();if(v.credentialAction==='清除')v.credential='未配置';delete v.secret;delete v.environment;delete v.credentialAction;delete v.testArgs;
const identifier=meta.id||v.id?.trim()||meta.kind+'_demo_'+serial++;if(!meta.id&&db[meta.kind].some(r=>r.id===identifier))return error('稳定标识已存在。');Object.assign(x,v,{id:identifier,dirty:true});if(meta.kind==='agents'){x.skillPins=x.skillPins||{};for(const sid of x.skills)if(!x.skillPins[sid])x.skillPins[sid]=find('skills',sid).version;}if(!meta.id)db[meta.kind].push(x);close();render();toast('演示：草稿已保存；当前运行版本保持不变。');}
function error(t){$('#formError').textContent=t;$('#formError').classList.remove('hidden')}
function impact(action,id){const x=find(page,id),references=refs(page,id);let title=action==='disable'?'确认全局停用':action==='default'?'设为系统默认模型':'发布影响预览';let text=action==='disable'?'停止新的请求与后续工具执行；已发出的外部请求不能保证撤销。不会自动改用其他资源。':action==='default'?'选择系统默认的Agent将于新任务开始时使用此模型；不会自动发连接探测。':page==='skills'?'产生新技能版本。现有Agent继续绑定旧版，需显式接受更新并重新发布。':'新任务使用新版本；正在执行的任务保留快照，停用状态仍在新执行前检查。';modal('<h2>'+title+'</h2><strong>'+esc(x.name)+'</strong><div class="notice warn">'+text+'</div><table><tr><th>变更</th><th>当前</th><th>目标</th></tr><tr><td>发布版本</td><td>'+(x.version?'v'+x.version:'未发布')+'</td><td>'+(action==='publish'?'v'+(x.version+1):action==='disable'?'停用':'系统默认')+'</td></tr><tr><td>凭证</td><td>不展示原文</td><td>'+esc(x.credential||'无凭证字段')+'</td></tr></table><h3>引用影响</h3><p>'+esc(references.join('、')||'暂无引用')+'</p><p>相关资源版本变化后，旧的待确认动作必须重新发起。</p><div class="foot"><button data-act="close">返回</button><button class="primary" data-act="commit" data-op="'+action+'" data-id="'+esc(id)+'">'+(action==='disable'?'确认停用':action==='default'?'确认设为默认':'确认发布')+'</button></div>',true);}
function commit(op,id){const x=find(page,id);if(op==='publish'){if(page==='agents'&&x.type==='SUPERVISOR'&&!x.children?.length)return toast('演示校验：主Agent至少需要一个已启用子Agent。');if(page==='agents'&&x.tools?.some(t=>find('tools',t)?.risk==='WRITE')&&!x.write)return toast('演示校验：存在写工具，但未允许修改业务数据。');x.version++;x.active=true;x.dirty=false;x.historyVersions=[...(x.historyVersions||[]),{version:x.version,at:new Date().toLocaleString()}];}else if(op==='disable')x.active=false;else {db.models.forEach(m=>m.isDefault=false);x.isDefault=true;}close();render();toast('演示：操作已生效。实际产品以服务端原子提交结果为准。');}
function references(id){const x=find(page,id),r=refs(page,id);modal('<h2>引用与版本 · '+esc(x.name)+'</h2><p>'+esc(r.join('、')||'无当前引用，可以删除草稿或停用资源。')+'</p><h3>版本记录</h3><p>当前发布 '+(x.version?'v'+x.version:'无')+'；草稿'+(x.dirty?'有变更':'无变更')+'</p><pre>'+esc(JSON.stringify(x.historyVersions||[{version:x.version,remark:'原型初始发布快照'}],null,2))+'</pre><div class="notice">资源名称可以变更，稳定身份和已有引用不变。历史回滚若依赖已被删除将明确失败。</div><div class="foot"><button data-act="edit" data-id="'+esc(id)+'">返回配置</button>'+(page==='models'?'<button data-act="default" data-id="'+esc(id)+'" '+(!x.active?'disabled':'')+'>设为默认</button>':'')+(page==='agents'?'<button data-act="trial" data-id="'+esc(id)+'">发布版本试运行</button>':'')+'<button class="danger" data-act="delete" data-id="'+esc(id)+'" '+(r.length?'disabled':'')+'>删除未引用资源</button></div>',true);}
function sync(id){const x=find('mcp',id);if(!x)return toast('请先保存MCP服务草稿。');modal('<h2>同步工具差异 · '+esc(x.name)+'</h2><div class="notice">演示同步成功，当前发布目录保持不变。发布后新增工具仍未获Agent授权。</div><table><tr><th>变化</th><th>工具</th><th>规则</th></tr><tr><td>新增</td><td>lookup_ticket</td><td>未知风险 → 写入/需确认</td></tr><tr><td>变更</td><td>search</td><td>增加可选limit输入</td></tr><tr><td>移除</td><td>old_search（示例）</td><td>发布移除后禁止新执行</td></tr></table><h3>影响</h3><p>引用此服务的Agent保留精确白名单，不会自动选择lookup_ticket。旧待确认动作在版本变更后失效。</p><div class="foot"><button data-act="close">暂不发布</button><button class="primary" data-act="syncpublish" data-id="'+esc(id)+'">发布同步目录</button></div>',true);}
function upgrade(id){if(!id)return toast('先保存Agent，再查看已绑定技能版本。');const a=find('agents',id);const rows=(a.skills||[]).map(sid=>{const s=find('skills',sid);return '<tr><td>'+esc(s.name)+'</td><td>v'+a.skillPins[sid]+'</td><td>v'+s.version+'</td><td>'+esc(s.tools?.map(t=>find('tools',t)?.name||t).join('、')||'无工具依赖')+'</td></tr>'}).join('');modal('<h2>技能版本差异</h2><p>先在技能页编辑并发布一个新版本，再回到这里查看升级。</p><table><tr><th>技能</th><th>当前绑定</th><th>可用版本</th><th>目标依赖</th></tr>'+rows+'</table><div class="notice warn">新增写工具仍须允许修改业务数据，且强制确认。接受更新只修改Agent草稿。</div><div class="foot"><button data-act="close">保留原版本</button><button class="primary" data-act="acceptupgrade" data-id="'+esc(id)+'">接受更新到草稿</button></div>',true);}
function execution(tool,agent=null,args={orderId:'DEMO-001'}){if(agent&&Number(agent.rounds)===0){modal('<h2>试运行停止</h2><div class="notice warn">最多工具调用轮数为0，本次未执行任何工具。</div><div class="foot"><button data-act="close">关闭</button></div>',true);return;}const model=agent?find('models',agent.model==='default'?db.models.find(m=>m.isDefault)?.id:agent.model):db.models.find(m=>m.isDefault);if(tool.risk==='WRITE'&&agent&&!agent.write)return toast('拒绝执行：当前Agent未允许修改业务数据。');events=[];const actionId='action_'+serial++;const info={tool,agent,args,model,actionId};window.pendingDemo=info;const preview='<p>实际模型：'+esc(model?.name+' / '+model?.provider+' / '+model?.model)+'</p><p>工具：'+esc(tool.name)+' · '+esc(tool.kind)+' · v'+tool.version+'</p><pre>'+esc(JSON.stringify(args,null,2))+'</pre><p>第1轮（同批多个工具仍只算1轮）；剩余预算 '+(agent?.totalTimeout||120)+' 秒。</p>';if(tool.risk==='WRITE'){modal('<h2>等待写操作确认</h2><span class="badge warn">演示动作 '+actionId+'</span>'+preview+'<div class="notice warn">确认将按以上参数执行。服务端保存动作身份、参数、版本与预算。停用、发布变更、取消、过期后不得执行；重复确认不重复外呼。</div><div class="foot"><button data-act="cancelwrite">取消动作</button><button data-act="stale">模拟资源已变更</button><button class="primary" data-act="confirmwrite">确认执行（模拟）</button></div>',true);}else finishExecution(info);}
function finishExecution(info){const {tool,agent,model,args,actionId}=info;events.push({actionId,round:1,tool:tool.id,source:tool.kind,resourceVersion:tool.version,status:'成功',durationMs:42,arguments:args,result:'演示结果：DEMO-RESULT-001'});modal('<h2>执行完成 · 演示</h2><div class="notice">实际产品在正式聊天与试运行返回相同模型和工具轨迹。本次原型没有执行网络请求。</div><p>Agent：'+esc(agent?.name||'工具测试')+' / 模型：'+esc(model?.provider+' / '+model?.model)+'</p><p>历史：最近'+(agent?.history??0)+'轮公开对话；摘要'+(agent?.summary?'开启':'关闭')+'。内部工具与思考不跨Agent共享。</p><pre>'+esc(JSON.stringify(events,null,2))+'</pre><p>Kimi输出为缓冲式SSE，不代表上游逐token推送。</p><div class="foot"><button data-act="close">完成</button></div>',true);window.pendingDemo=null;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;$('#search').value='';$('#status').value='all';render();return;}const a=b.dataset.act,id=b.dataset.id;if(a==='close')close();if(a==='edit')edit(id);if(a==='publish'||a==='disable'||a==='default')impact(a,id);if(a==='commit')commit(b.dataset.op,id);if(a==='refs')references(id);if(a==='delete'){db[page]=db[page].filter(x=>x.id!==id);close();render();toast('演示：已删除未引用资源。');}if(a==='connection'){$('#connectionResult').textContent='模拟成功 · 仅当前草稿；没有请求真实模型/MCP。凭证状态不会在结果中回显原文。';}if(a==='sync')sync(id);if(a==='syncfail'){$('#connectionResult').textContent='模拟超时：保留上次已发布目录；可重试，不清空资源。';}if(a==='syncpublish'){const s=find('mcp',id);s.tools=['search','lookup_ticket'];s.version++;s.sync='同步并发布成功（演示）';s.dirty=false;close();render();toast('新工具已进入目录，尚未自动授权任何Agent。');}if(a==='upgrade')upgrade(id);if(a==='acceptupgrade'){const agent=find('agents',id);for(const sid of agent.skills)agent.skillPins[sid]=find('skills',sid).version;agent.dirty=true;close();render();toast('升级已进入Agent草稿；重新发布才生效。');}if(a==='trial'){const agent=find('agents',id),tool=find('tools',agent.tools?.find(t=>find('tools',t)?.risk==='WRITE')||agent.tools?.[0]||'query_order');execution(tool,agent);}if(a==='tooltest'){let v=values(),args;try{args=JSON.parse(v.testArgs||'{}')}catch{return error('测试参数不是有效JSON，未执行。');}execution({...v,kind:editing.id?find(page,editing.id).kind:'HTTP',version:editing.id?find(page,editing.id).version:0,id:editing.id||'draft_tool'},null,args);}if(a==='confirmwrite'){const p=window.pendingDemo;if(p)finishExecution(p);else toast('该动作已处理，不会再次执行。');}if(a==='cancelwrite'){window.pendingDemo=null;close();toast('动作已取消；再次确认不得执行。');}if(a==='stale'){window.pendingDemo=null;modal('<h2>确认已失效</h2><div class="notice warn">相关资源版本已变更。本次没有执行工具，请重新发起任务并确认最新参数。</div><div class="foot"><button data-act="close">返回</button></div>',true);}});
document.addEventListener('submit',e=>{if(e.target.id==='editor'){e.preventDefault();save();}});document.addEventListener('change',e=>{const t=e.target;if(t.name==='credentialAction'){if($('#newSecret'))$('#newSecret').classList.toggle('hidden',t.value!=='替换为新值');if($('#envSecret'))$('#envSecret').classList.toggle('hidden',t.value!=='引用服务端变量');if($('#clearSecret'))$('#clearSecret').classList.toggle('hidden',t.value!=='清除');}if(t.name==='provider'){$('#kimiOptions').classList.toggle('hidden',t.value!=='Kimi');$('#openaiOptions').classList.toggle('hidden',t.value!=='OpenAI');}if(t.name==='type'){$('#childSection').classList.toggle('hidden',t.value!=='SUPERVISOR');const w=$('[name=write]');w.disabled=t.value==='SUPERVISOR';if(w.disabled)w.checked=false;}if(t.name==='risk'){const c=$('[name=confirm]');c.disabled=t.value==='WRITE';if(c.disabled)c.checked=true;}if($('#connectionResult')&&t.name!=='testArgs')$('#connectionResult').textContent='配置已变更；上次测试结果不代表当前草稿。';});$('#create').onclick=()=>edit();$('#search').oninput=render;$('#status').onchange=render;$('#reset').onclick=()=>{db=structuredClone(seed);close();render();toast('已重置演示资源。');};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
